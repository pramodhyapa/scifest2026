<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The P–V–T surface</title>
<meta name="description" content="An interactive pressure–volume–temperature surface with phase changes, projections and engine cycles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ECF1EA; --panel: #F5F8F3; --ink: #1B2A32; --muted: #56666C; --rule: #C6D1C8;
  --grid: rgba(40, 90, 60, .07); --grid2: rgba(40, 90, 60, .14);
  --red: #D2352B; --hot: #E0582F; --cold: #3F84C6; --wall: #DCE4D9; --iso: #33434A;
  --c-solid: #7D8AA2; --c-liquid: #4A90C2; --c-gas: #E0C27C; --c-sc: #A68BCF; --c-sl: #6890B6; --c-lv: #9CB7A9; --c-sv: #B4AF9A; --c-ink: var(--ink);
  --box-interior: #FBFCFA; --box-piston: #AEB8B2; --box-weight: #3A4A52; --box-shine: rgba(255, 255, 255, .55);
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --ui: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --shadow: 0 1px 0 rgba(27, 42, 50, .04), 0 6px 18px -8px rgba(27, 42, 50, .25);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #18211D; --panel: #1F2A25; --ink: #E3EAE3; --muted: #98A8A0; --rule: #34443B;
    --grid: rgba(160, 210, 180, .05); --grid2: rgba(160, 210, 180, .1);
    --red: #F0564A; --hot: #F0764A; --cold: #5C9EDC; --wall: #24302A; --iso: #C4D0C8;
    --c-solid: #7A87A0; --c-liquid: #4586B6; --c-gas: #C9AE6C; --c-sc: #957CC0; --c-sl: #5F85AB; --c-lv: #7F9C8E; --c-sv: #9C9884;
    --box-interior: #243029; --box-piston: #5E6C65; --box-weight: #93A39B; --box-shine: rgba(255, 255, 255, .35);
    --shadow: 0 6px 18px -8px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #18211D; --panel: #1F2A25; --ink: #E3EAE3; --muted: #98A8A0; --rule: #34443B;
  --grid: rgba(160, 210, 180, .05); --grid2: rgba(160, 210, 180, .1);
  --red: #F0564A; --hot: #F0764A; --cold: #5C9EDC; --wall: #24302A; --iso: #C4D0C8;
  --c-solid: #7A87A0; --c-liquid: #4586B6; --c-gas: #C9AE6C; --c-sc: #957CC0; --c-sl: #5F85AB; --c-lv: #7F9C8E; --c-sv: #9C9884;
  --box-interior: #243029; --box-piston: #5E6C65; --box-weight: #93A39B; --box-shine: rgba(255, 255, 255, .35);
  --shadow: 0 6px 18px -8px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
i { font-family: var(--serif); font-style: italic; }
sub { font-size: .72em; line-height: 0; vertical-align: -.25em; }

.app { max-width: 1800px; margin: 0 auto; padding: 12px 18px 14px; }
.top { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; margin-bottom: 10px; }
.top h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(24px, 2.1vw, 31px); line-height: 1; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.top h1 i { font-weight: 400; }
.tools { display: flex; align-items: center; gap: 10px; margin-left: auto; pointer-events: auto; }
.linkbtn { border: 0; background: color-mix(in srgb, var(--paper) 80%, transparent); border-radius: 4px; padding: 4px 6px; color: var(--muted); cursor: pointer; font-size: 14px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.linkbtn:hover, .linkbtn[aria-expanded="true"] { color: var(--ink); }
.langbtn { align-self: start; margin-top: 2px; border: 1px solid var(--ink); background: var(--panel); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 14px; font-weight: 600; }
.langbtn:hover { background: var(--ink); color: var(--paper); }
.note { position: absolute; right: 0; top: calc(100% + 6px); pointer-events: auto; z-index: 20; width: min(520px, 92vw); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); padding: 14px 16px 12px; }
.note p { margin: 0 0 10px; font-family: var(--serif); font-size: 15.5px; line-height: 1.5; }
.note button { border: 1px solid var(--rule); background: var(--paper); border-radius: 5px; padding: 4px 12px; cursor: pointer; font-size: 14px; }

.scen { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.scen .grp { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.scen .gl { color: var(--muted); font-size: 13px; margin-right: 2px; }
.chip { border: 1px solid var(--rule); background: var(--panel); border-radius: 18px; padding: 5px 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 14px; align-items: stretch; }
.stage { min-width: 0; display: flex; flex-direction: column; }
.viewport {
  position: relative; flex: 1 1 auto; min-height: 340px; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid2) 1px, transparent 1px), linear-gradient(90deg, var(--grid2) 1px, transparent 1px);
  background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px; background-position: -1px -1px;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lab { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; transition: opacity .2s; }
.lab.off { visibility: hidden; }
.lab.hidden { opacity: .2; }
.lab.region { translate: -50% -50%; font-weight: 600; font-size: 13.5px; letter-spacing: .01em; color: var(--ink);
  text-shadow: 0 0 2px var(--paper), 0 0 4px var(--paper), 0 0 6px var(--paper), 0 0 8px var(--paper); }
.lab.r-critical, .lab.r-triple { font-weight: 500; font-style: normal; }
.lab.r-critical { translate: 10px -120%; }
.lab.r-triple { translate: -50% -135%; }
.lab.marker { translate: 7px -115%; font-family: var(--serif); font-style: italic; font-size: 17px; font-weight: 500; color: var(--ink);
  text-shadow: 0 0 2px var(--paper), 0 0 5px var(--paper), 0 0 8px var(--paper); }
.lab.axis { color: var(--ink); text-shadow: 0 0 3px var(--paper), 0 0 6px var(--paper); }
.lab.axis.name { translate: -50% -20%; font-size: 19px; }
.lab.axis.name small { font-family: var(--ui); font-size: 12px; color: var(--muted); margin-left: 5px; font-style: normal; }
.lab.axis.tick { translate: -50% -10%; font-size: 14px; color: var(--muted); }
.lab.axis.tick.left { translate: calc(-100% - 2px) -50%; }
.tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 6px 9px; box-shadow: var(--shadow); font-size: 13px; max-width: 200px; }
.tip b { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.tip span:last-child { color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }

.viewbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.viewbar .seg { pointer-events: auto; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-size: 14px; font-weight: 500; cursor: pointer; border-right: 1px solid var(--rule); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg.toggles button[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 12%, var(--panel)); color: var(--ink); }
.seg.toggles button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.hint { position: absolute; left: 10px; bottom: 8px; margin: 0; font-size: 12.5px; color: var(--muted); pointer-events: none; background: color-mix(in srgb, var(--paper) 82%, transparent); padding: 2px 6px; border-radius: 3px; }
.glfail { display: none; position: absolute; inset: 0; place-items: center; padding: 24px; text-align: center; font-family: var(--serif); font-size: 18px; }
.no-gl .glfail { display: grid; }
.no-gl #gl, .no-gl .viewbar, .no-gl .hint { display: none; }

.transport { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.is-explore .transport { visibility: hidden; }
.tbtns { display: flex; gap: 6px; }
.ib { display: inline-flex; align-items: center; gap: 6px; height: 34px; min-width: 34px; justify-content: center; border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 0 8px; cursor: pointer; font-weight: 500; font-size: 14px; }
.ib:hover:not(:disabled) { border-color: var(--muted); }
.ib:disabled { opacity: .4; cursor: default; }
.ib svg { width: 18px; height: 18px; fill: currentColor; }
.ib.play { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 44px; }
#bNextLab { display: none; }
.is-steps #bNextLab { display: inline; }
.is-steps #bNext { background: var(--red); border-color: var(--red); color: #fff; padding: 0 12px; }
.scrubwrap { position: relative; flex: 1 1 200px; min-width: 160px; height: 34px; display: flex; align-items: center; }
#scrub { width: 100%; accent-color: var(--red); margin: 0; }
.ticks { position: absolute; left: 8px; right: 8px; top: 27px; height: 6px; pointer-events: none; }
.ticks span { position: absolute; width: 1px; height: 6px; background: var(--muted); }

.side { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 16px 14px; overflow: auto; min-height: 0; }
.sample { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 14px; align-items: end; }
.boxwrap { height: clamp(250px, 34vh, 340px); }
#box { width: 100%; height: 100%; display: block; }
.meas { min-width: 0; padding-bottom: 2px; }
.readout { border-top: 1px solid var(--rule); }
.rv { display: grid; grid-template-columns: 22px 1fr; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.rv .k { font-size: 18px; color: var(--muted); }
.rv .v { font-size: 21px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rv .u { font-size: 14px; color: var(--muted); font-weight: 400; }
.phase { padding: 9px 0 2px; }
.rname { font-family: var(--serif); font-size: 19px; line-height: 1.2; }
.pbar { display: flex; height: 9px; border-radius: 2px; overflow: hidden; background: var(--rule); margin: 6px 0 4px; }
.pbar span { height: 100%; transition: width .25s linear; }
.pbar .s { background: var(--c-solid); } .pbar .l { background: var(--c-liquid); } .pbar .g { background: var(--c-gas); } .pbar .g.sc { background: var(--c-sc); }
.legend { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.4em; }
.cap { margin: 10px 0 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.card { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--ink); }
.card .step { margin: 0 0 2px; font-size: 13px; color: var(--muted); }
.card .step:empty { display: none; }
.card h2 { font-family: var(--serif); font-weight: 500; font-size: 21px; line-height: 1.15; margin: 0 0 5px; }
.card p#cText { font-family: var(--serif); font-size: 16px; line-height: 1.45; margin: 0; }
.card .extra { font-family: var(--serif); font-size: 15px; line-height: 1.4; margin: 9px 0 0; padding: 7px 10px; background: color-mix(in srgb, var(--red) 8%, var(--panel)); border-left: 2px solid var(--red); }
.card.fresh h2, .card.fresh p#cText { animation: fresh .35s ease-out; }
@keyframes fresh { from { opacity: .15; } to { opacity: 1; } }
.about { margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--rule); }
.about .lead { margin: 0; font-size: 13px; color: var(--muted); }
.about h3 { display: flex; align-items: center; gap: 7px; margin: 2px 0 4px; font-size: 16px; font-weight: 600; }
.about p#aText { margin: 0; font-size: 14px; line-height: 1.42; }
#aUnpin { margin-top: 8px; border: 0; background: none; padding: 0; color: var(--red); cursor: pointer; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.seg button:focus-visible { outline-offset: -3px; }

@media (min-width: 961px) and (min-height: 600px) {
  html, body { height: 100%; overflow: hidden; }
  .app { height: 100%; display: flex; flex-direction: column; }
  .grid { flex: 1 1 auto; min-height: 0; }
  .stage, .side { min-height: 0; }
}
@media (min-width: 961px) and (max-height: 760px) {
  .boxwrap { height: 240px; }
  .card p#cText { font-size: 15px; }
  .about p#aText { font-size: 13.5px; }
}
@media (max-width: 960px) {
  .app { padding: 12px 12px 18px; }
  .top { display: flex; flex-wrap: wrap; }
  .scen .grp { flex-wrap: nowrap; }
  .langbtn { margin-left: auto; }
  .scen { order: 3; flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -12px; padding-left: 12px; padding-right: 12px; scrollbar-width: none; }
  .sample { grid-template-columns: 200px minmax(0, 1fr); }
  .boxwrap { height: 270px; }
  .scen .gl { white-space: nowrap; }
  .chip { white-space: nowrap; }
  .grid { grid-template-columns: 1fr; }
  .viewport { flex: none; height: clamp(340px, 60vh, 640px); }
  .side { max-height: none; }
  .hint { display: none; }
  .seg button { padding: 5px 8px; font-size: 13.5px; }
  .viewbar { top: 8px; left: 8px; right: 8px; gap: 6px; }
  .is-explore .transport { display: none; }
  .lab.region { font-size: 11.5px; }
  .lab.marker { font-size: 15px; }
  .lab.axis.name { font-size: 16px; }
  .lab.axis.tick { font-size: 12px; }
  .transport { gap: 8px; }
  .scrubwrap { order: 5; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .card.fresh h2, .card.fresh p#cText { animation: none; }
  .pbar span, .lab { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 data-i18n="title">The <i>P</i>–<i>V</i>–<i>T</i> surface</h1>
    <nav class="scen" aria-label="Scenarios" data-i18n-aria="scenAria">
      <span class="grp"><button class="chip" data-s="explore" aria-pressed="true">Explore</button></span>
      <span class="grp"><span class="gl" data-i18n="phaseChanges">Phase changes</span>
        <button class="chip" data-s="melting" aria-pressed="false">Melting</button>
        <button class="chip" data-s="boiling" aria-pressed="false">Boiling</button>
        <button class="chip" data-s="sublimation" aria-pressed="false">Sublimation</button>
        <button class="chip" data-s="condensing" aria-pressed="false">Condensing a vapor</button>
        <button class="chip" data-s="around" aria-pressed="false">Liquid to gas without boiling</button></span>
      <span class="grp"><span class="gl" data-i18n="cycles">Cycles</span>
        <button class="chip" data-s="carnot" aria-pressed="false">Carnot engine</button></span>
    </nav>
    <button id="langBtn" class="langbtn" lang="sv">Svenska</button>
  </header>
  <main class="grid">
    <section class="stage">
      <div class="viewport" id="vp">
        <canvas id="gl" data-i18n-aria="canvasAria"></canvas>
        <div class="labels" id="labels" aria-hidden="true"></div>
        <div class="tip" id="tip" hidden></div>
        <div class="viewbar" id="vbtns">
          <div class="seg" role="group" data-i18n-aria="viewGroup">
            <button data-view="d3" aria-pressed="false">3D</button>
            <button data-view="pt" aria-pressed="false"><i>P</i>–<i>T</i></button>
            <button data-view="pv" aria-pressed="false"><i>P</i>–<i>V</i></button>
            <button data-view="rec" aria-pressed="true" data-i18n="vRec">Recommended</button>
          </div>
          <div class="seg toggles" role="group" data-i18n-aria="showGroup">
            <button data-toggle="labels" aria-pressed="true" data-i18n="tLabels">Labels</button>
            <button data-toggle="iso" aria-pressed="true" data-i18n="tIso">Isotherms</button>
          </div>
          <div class="tools">
            <button id="noteBtn" class="linkbtn" aria-expanded="false" aria-controls="note" data-i18n="noteBtn">About the scales</button>
          </div>
          <div id="note" class="note" role="dialog" aria-labelledby="noteBtn" hidden>
            <p data-i18n="note"></p>
            <button id="noteClose" data-i18n="noteClose">Close</button>
          </div>
        </div>
        <p class="hint" data-i18n="hint"></p>
        <div class="glfail"><p data-i18n="glfail">The 3D surface needs three.js from cdnjs.cloudflare.com and WebGL. One of them didn’t load; check the connection and reload the page.</p></div>
      </div>
      <div class="transport" id="transport">
        <div class="seg" id="modes" role="group" data-i18n-aria="modeGroup">
          <button data-mode="continuous" aria-pressed="true" data-i18n="continuous">Continuous</button>
          <button data-mode="steps" aria-pressed="false" data-i18n="steps">Step by step</button>
        </div>
        <div class="tbtns">
          <button id="bPrev" class="ib"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h2.2v12H5zM16 4.2v11.6L8 10z"/></svg></button>
          <button id="bPlay" class="ib play"></button>
          <button id="bNext" class="ib"><span id="bNextLab">Next step</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.2v11.6L12 10zM12.8 4H15v12h-2.2z"/></svg></button>
        </div>
        <div class="scrubwrap"><input type="range" id="scrub" min="0" max="1000" value="0" data-i18n-aria="scrub"><div class="ticks" id="ticks"></div></div>
        <div class="seg" id="speeds" role="group" data-i18n-aria="speed">
          <button data-speed="0.5" aria-pressed="false">0.5×</button>
          <button data-speed="1" aria-pressed="true">1×</button>
          <button data-speed="2" aria-pressed="false">2×</button>
        </div>
      </div>
    </section>
    <aside class="side" data-i18n-aria="sampleAria">
      <div class="sample">
        <div class="boxwrap"><canvas id="box" role="img" data-i18n-aria="boxAria"></canvas></div>
        <div class="meas">
          <div class="readout">
            <div class="rv"><span class="k"><i>T</i></span><span class="v"><span id="rT"></span> <span class="u"><i>T</i><sub>c</sub></span></span></div>
            <div class="rv"><span class="k"><i>P</i></span><span class="v"><span id="rP"></span> <span class="u"><i>P</i><sub>c</sub></span></span></div>
            <div class="rv"><span class="k"><i>V</i></span><span class="v"><span id="rV"></span> <span class="u"><i>V</i><sub>c</sub></span></span></div>
          </div>
          <div class="phase">
            <span class="rname" id="rRegion"></span>
            <div class="pbar" aria-hidden="true"><span class="s" id="pbS"></span><span class="l" id="pbL"></span><span class="g" id="pbG"></span></div>
            <p class="legend" id="legend"></p>
          </div>
          <p class="cap" id="boxcap"></p>
        </div>
      </div>
      <article class="card" id="card">
        <p class="step" id="cStep"></p>
        <h2 id="cTitle"></h2>
        <p id="cText"></p>
        <p class="extra" id="cExtra" hidden></p>
      </article>
      <section class="about" data-i18n-aria="aboutAria">
        <p class="lead" id="aLead"></p>
        <h3><span class="sw" id="aSwatch"></span><span id="aTitle"></span></h3>
        <p id="aText"></p>
        <button id="aUnpin" hidden data-i18n="unpin"></button>
      </section>
    </aside>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Physics: reduced van der Waals fluid + schematic solid =====
const PHYS = (() => {

      ctx.fillStyle = C.red;
      const pr = 0.46 * s;
      for (const p of sim.ps) { ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), pr, 0, 6.2832); ctx.fill(); }
      ctx.fillStyle = C.shine;
      for (const p of sim.ps) { ctx.beginPath(); ctx.arc(X(p.x - 0.14), Y(p.y + 0.15), pr * 0.28, 0, 6.2832); ctx.fill(); }

      // piston
      ctx.fillStyle = C.piston;
      ctx.fillRect(X(0.06), Y(h + PT), (W - 0.12) * s, PT * s);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2 * dpr; ctx.strokeRect(X(0.06), Y(h + PT), (W - 0.12) * s, PT * s);
      const top = h + PT;
      if (this.kind === 'engine') {
        const th = this.thetaFor(top, !!deco.expanding);
        this.theta = th;
        const { r, R, cy } = this;
        const pinx = mid + r * Math.sin(th), piny = cy + r * Math.cos(th);
        ctx.strokeStyle = C.ink; ctx.lineWidth = 2 * dpr;
        ctx.beginPath(); ctx.arc(X(mid), Y(cy), R * s, 0, 6.2832); ctx.stroke();
        ctx.lineWidth = 1 * dpr; ctx.strokeStyle = C.muted;
        for (let k = 0; k < 3; k++) { const a = th + k * 2.0944; ctx.beginPath(); ctx.moveTo(X(mid), Y(cy)); ctx.lineTo(X(mid + R * Math.sin(a)), Y(cy + R * Math.cos(a))); ctx.stroke(); }
        ctx.strokeStyle = C.ink; ctx.lineWidth = 3 * dpr;
        ctx.beginPath(); ctx.moveTo(X(mid), Y(top)); ctx.lineTo(X(pinx), Y(piny)); ctx.stroke();
        ctx.fillStyle = C.ink;
        ctx.beginPath(); ctx.arc(X(pinx), Y(piny), 0.28 * s, 0, 6.2832); ctx.fill();
        ctx.beginPath(); ctx.arc(X(mid), Y(cy), 0.22 * s, 0, 6.2832); ctx.fill();
        ctx.beginPath(); ctx.arc(X(mid), Y(top), 0.2 * s, 0, 6.2832); ctx.fill();
        if (deco.work) {
          const up = deco.work === 'out', ax = X(mid + R + 0.9);
          ctx.strokeStyle = C.ink;
          this.arrow(ax, Y(up ? cy - 1.1 : cy + 1.1), Y(up ? cy + 1.1 : cy - 1.1), s, 1.7 * dpr);
          ctx.fillStyle = C.ink; ctx.font = font(12, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(up ? T.workOut : T.workIn, ax + 0.45 * s, Y(cy));
        }
      } else if (deco.piston === 'weight') {
        const wh = 1.45;
        ctx.fillStyle = C.weight;
        ctx.fillRect(X(mid - 2.4), Y(top + wh), 4.8 * s, wh * s);
        ctx.fillStyle = C.paper; ctx.font = font(11, 600); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(T.weight, X(mid), Y(top + wh / 2));
      } else if (deco.piston === 'push' || deco.piston === 'pull') {
        ctx.strokeStyle = C.ink; ctx.lineWidth = 3 * dpr;
        ctx.beginPath(); ctx.moveTo(X(mid), Y(top)); ctx.lineTo(X(mid), Y(top + 1.9)); ctx.stroke();
        const down = deco.piston === 'push';
        this.arrow(X(mid + 1.4), Y(top + (down ? 1.9 : 0.4)), Y(top + (down ? 0.4 : 1.9)), s, 1.8 * dpr);
        ctx.fillStyle = C.ink; ctx.font = font(12, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(down ? T.push : T.pull, X(mid + 1.85), Y(top + 1.15));
      } else {
        ctx.strokeStyle = C.ink; ctx.lineWidth = 3 * dpr;
        ctx.beginPath(); ctx.moveTo(X(mid), Y(top)); ctx.lineTo(X(mid), Y(top + 1.3)); ctx.stroke();
      }
      // cylinder walls
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2.6 * dpr;
      ctx.beginPath(); ctx.moveTo(X(-0.08), Y(this.Hcyl)); ctx.lineTo(X(-0.08), Y(-0.08)); ctx.lineTo(X(W + 0.08), Y(-0.08)); ctx.lineTo(X(W + 0.08), Y(this.Hcyl)); ctx.stroke();
    }
  }
  return { View, crank, pistonY };
})();

// ===== Display mapping + scenario definitions =====
const MAP = (() => {
  const P = PHYS;
  const WX = 10, HY = 6, DZ = 8, VOFF = 0.32;
  const LMIN = Math.log(P.vSolid(P.TMIN, P.PMAX) - VOFF) - 0.04, LMAX = Math.log(P.VMAX - VOFF);
  const X = v => WX * (Math.log(Math.max(v - VOFF, 1e-9)) - LMIN) / (LMAX - LMIN);
  const Vinv = x => Math.exp(LMIN + x / WX * (LMAX - LMIN)) + VOFF;
  const Y = p => HY * Math.pow(Math.max(p, 0) / P.PMAX, 0.6);
  const Pinv = y => P.PMAX * Math.pow(Math.max(y, 0) / HY, 1 / 0.6);
  const Z = T => -DZ * (T - P.TMIN) / (P.TMAX - P.TMIN);
  const Tinv = z => P.TMIN + (-z / DZ) * (P.TMAX - P.TMIN);
  const TD = u => 1 - (1 - P.Tt) * (1 - u) * (1 - u); // dense near Tc
  return { WX, HY, DZ, X, Vinv, Y, Pinv, Z, Tinv, TD };
})();

const SCEN = (() => {
  const P = PHYS, { Vinv, X } = MAP;
  const lerp = (a, b, t) => a + (b - a) * t;
  const N = 48;
  const range = (a, b, n = N) => Array.from({ length: n + 1 }, (_, i) => lerp(a, b, i / n));

  // entropy of any state (coexistence uses the lever rule)
  function entropy(st) {
    if (st._s != null) return st._s;
    return P.S(st.T, st.v);
  }
  const isobar = (Ta, Tb, p, phase, n) => range(Ta, Tb, n).map(T => P.single(T, p, phase));
  const isothermV = (T, va, vb, phase, n = N) => range(X(va), X(vb), n).map(x => { const v = Vinv(x); return P.fluidState(T, P.Pvdw(T, v), v, phase); });
  const isothermP = (T, pa, pb, phase, n = N) => range(pa, pb, n).map(p => P.single(T, p, phase));
  function coexLV(T, xa, xb, n = N) {
    const s = P.sat(T);
    return range(xa, xb, n).map(x => {
      const st = P.coex(T, s.P, s.vl, s.vg, 'liquid', 'gas', x);
      st._s = (1 - x) * P.S(T, s.vl) + x * P.S(T, s.vg);
      if (x <= 0) { st.region = 'liquid'; } else if (x >= 1) { st.region = 'gas'; }
      return st;
    });
  }
  function coexSL(T, xa, xb, n = N) {
    const p = P.Pmelt(T), vs = P.vSolid(T, p), vl = P.vLiq(T, p);
    return range(xa, xb, n).map(x => { const st = P.coex(T, p, vs, vl, 'solid', 'liquid', x); if (x <= 0) st.region = 'solid'; if (x >= 1) st.region = 'liquid'; return st; });
  }
  function coexSV(T, xa, xb, n = N) {
    const p = P.Psub(T), vs = P.vSolid(T, p), vg = P.vGas(T, p);
    return range(xa, xb, n).map(x => { const st = P.coex(T, p, vs, vg, 'solid', 'gas', x); if (x <= 0) st.region = 'solid'; if (x >= 1) st.region = 'gas'; return st; });
  }
  const bisect = (f, lo, hi, it = 80) => { const flo = f(lo); for (let i = 0; i < it; i++) { const m = (lo + hi) / 2; if ((f(m) > 0) === (flo > 0)) lo = m; else hi = m; } return (lo + hi) / 2; };
  const f2 = x => x.toFixed(2);
  const pct = x => Math.round(x * 100) + '%';

  // Heat taken in and net work, integrated along the closed path
  function cycleNumbers(states) {
    let W = 0, Qin = 0, Tmin = Infinity, Tmax = -Infinity;
    for (let i = 0; i < states.length; i++) {
      const a = states[i], b = states[(i + 1) % states.length];
      W += 0.5 * (a.P + b.P) * (b.v - a.v);
      const dQ = 0.5 * (a.T + b.T) * (entropy(b) - entropy(a));
      if (dQ > 0) Qin += dQ;
      Tmin = Math.min(Tmin, a.T); Tmax = Math.max(Tmax, a.T);
    }
    return { W, Qin, eta: W / Qin, carnot: 1 - Tmin / Tmax, Tmin, Tmax };
  }

  const HOT = { heat: 'hot', piston: 'weight' };
  const L2 = (en, sv) => ({ en, sv });
  const Tc = '<i>T</i><sub>c</sub>', Pc = '<i>P</i><sub>c</sub>', Pt = '<i>P</i><sub>t</sub>', iT = '<i>T</i>', iP = '<i>P</i>', iV = '<i>V</i>';
  const PTv = '<i>P</i>–<i>T</i>', PVv = '<i>P</i>–<i>V</i>';
  const pctL = x => L2(Math.round(x * 100) + '%', Math.round(x * 100) + '&nbsp;%');
  const sv = x => String(x).replace('.', ',');

  function melting() {
    const p = 0.5, Tm = P.Tmelt(p);
    return {
      id: 'melting', name: L2('Melting', 'Smältning'), kind: 'phase', cycle: false,
      view: { az: Math.PI / 2, el: 0, extra: [[P.Tt, P.Pt, 1], [1, 1.05, 1], [0.47, 1.1, 1], [0.8, 0.2, 1]], maxZoom: 1.8 },
      intro: {
        title: L2('Melting at constant pressure', 'Smältning vid konstant tryck'),
        text: L2(`A weight on the piston holds the pressure at 0.5 ${Pc} while heat flows in from below. In the ${PTv} view the path is a horizontal line that crosses the melting curve: the whole melting stage happens at that one crossing point, while the cylinder shows the solid turning into liquid. Switch to 3D to see the stage spread out across the solid + liquid band.`,
          `En vikt på kolven håller trycket på 0,5 ${Pc} medan värme strömmar in underifrån. I ${PTv}-vyn är vägen en vågrät linje som korsar smältkurvan: hela smältningen sker i just den skärningspunkten, medan cylindern visar hur det fasta ämnet blir vätska. Byt till 3D för att se smältningen utbredd över bandet fast + vätska.`)
      },
      segs: [
        { title: L2('Warming the solid', 'Uppvärmning av det fasta ämnet'), text: L2('The molecules stay locked in their lattice and only vibrate harder. The volume hardly changes, which is why the solid face of the surface stands almost upright.', 'Molekylerna sitter kvar i sitt gitter och vibrerar bara kraftigare. Volymen ändras knappt, och därför står ytans fasta del nästan lodrätt.'), dur: 3.2, deco: HOT, states: isobar(0.5, Tm, p, 'solid') },
        { title: L2('Melting', 'Smältning'), text: L2(`At the melting temperature the heat no longer raises ${iT}. It goes into breaking up the lattice while solid and liquid coexist, so the point waits on the melting curve. On the 3D surface it would instead be crossing the solid + liquid band along a tie line.`, `Vid smälttemperaturen höjer värmen inte längre ${iT}. Den går åt till att bryta upp gittret medan fast fas och vätska samexisterar, så punkten står still på smältkurvan. På 3D-ytan rör den sig i stället över bandet fast + vätska längs en konnod.`), dur: 5, deco: HOT, states: coexSL(Tm, 0, 1), param: 'index' },

  function rankine() {
    const PL = 0.3, PH = 0.8, T3 = 1.03;
    const T1 = P.Tsat(PL), s1sat = P.sat(T1), v1 = s1sat.vl, s1 = P.S(T1, v1);
    const Tis = (s, v) => Math.exp((s - P.R * Math.log(v - P.b)) / P.CV);
    const v2 = bisect(v => P.Pvdw(Tis(s1, v), v) - PH, v1 * 0.85, v1);
    const pump = range(v1, v2, 24).map(v => { const T = Tis(s1, v); const st = P.fluidState(T, P.Pvdw(T, v), v, 'liquid'); st._s = s1; return st; });
    const T2 = pump[pump.length - 1].T, Tb = P.Tsat(PH);
    const heatL = isobar(T2, Tb, PH, 'liquid', 30);
    const boil = coexLV(Tb, 0, 1);
    const superheat = isobar(Tb, T3, PH, 'gas', 30);
    const v3 = superheat[superheat.length - 1].v, s3 = P.S(T3, v3);
    const vIs = T => P.b + Math.exp((s3 - P.CV * Math.log(T)) / P.R);
    const inDome = T => T < 1 && vIs(T) < P.sat(T).vg;
    const Te = bisect(T => (inDome(T) ? 1 : -1), T1, Math.min(T3, 0.9999));
    const turbState = T => {
      if (!inDome(T)) { const v = vIs(T); const st = P.fluidState(T, P.Pvdw(T, v), v, 'gas'); st._s = s3; return st; }
      const s = P.sat(T), sl = P.S(T, s.vl), sg = P.S(T, s.vg), x = Math.min(1, (s3 - sl) / (sg - sl));
      const st = P.coex(T, s.P, s.vl, s.vg, 'liquid', 'gas', x); st._s = s3; return st;
    };
    const turbine = [...range(T3, Te, 24), ...range(Te, T1, 30).slice(1)].map(turbState);
    const x4 = turbine[turbine.length - 1].fg;
    const cond = coexLV(T1, x4, 0);
    const all = [...pump, ...heatL.slice(1), ...boil.slice(1), ...superheat.slice(1), ...turbine.slice(1), ...cond.slice(1, -1)];
    const nums = cycleNumbers(all);
    const e = pctL(nums.eta), c = pctL(nums.carnot), wet = pctL(1 - x4);
    const effText = L2(`Over one turn the engine converts about <b>${e.en}</b> of the heat it takes in into work. A Carnot engine working between the same extreme temperatures (${f2(nums.Tmin)} and ${f2(nums.Tmax)} ${Tc}) could reach ${c.en}; the difference comes mostly from heating the cold liquid up to the boiling point.`,
      `Under ett varv omvandlar motorn ungefär <b>${e.sv}</b> av den upptagna värmen till arbete. En Carnotmotor mellan samma extrema temperaturer (${sv(f2(nums.Tmin))} och ${sv(f2(nums.Tmax))} ${Tc}) skulle kunna nå ${c.sv}; skillnaden beror mest på att den kalla vätskan måste värmas upp till kokpunkten.`);
    const ins = { heat: 'insul' };
    return {
      id: 'rankine', name: L2('Steam engine (Rankine)', 'Ångmaskin (Rankine)'), kind: 'engine', cycle: true, hidden: true, nums, effText,
      view: { az: 0.62, el: 0.36, extra: [[1, 1, 1]], maxZoom: 2 },
      intro: {
        title: L2('Steam engine: the Rankine cycle', 'Ångmaskin: Rankinecykeln'),
        text: L2('The working fluid is pumped as a liquid, boiled and superheated at high pressure, expanded to deliver work, then condensed back to liquid. A power plant uses a separate pump, boiler, turbine and condenser; here a single cylinder does the four jobs in turn. The 3D view is used because it shows how the loop wraps around the liquid + vapor dome, which neither projection shows at once.',
          'Arbetsmediet pumpas som vätska, kokas och överhettas vid högt tryck, expanderar och uträttar arbete och kondenseras sedan tillbaka till vätska. Ett kraftverk har separat pump, panna, turbin och kondensor; här gör en enda cylinder de fyra jobben i tur och ordning. 3D-vyn används eftersom den visar hur slingan lindar sig runt kupolen för vätska + ånga, vilket ingen av projektionerna visar på en gång.')
      },
      segs: [
        { title: L2('Pumping the liquid', 'Pumpning av vätskan'), text: L2(`Insulated, the liquid is squeezed from ${PL} to ${PH} ${Pc}. Liquids are nearly incompressible, so this costs very little work.`, `Isolerad trycks vätskan ihop från ${sv(PL)} till ${sv(PH)} ${Pc}. Vätskor är nästan inkompressibla, så det kostar mycket lite arbete.`), dur: 2.4, deco: { ...ins, work: 'in', expanding: false }, states: pump },
        { title: L2('Heating to the boiling point', 'Uppvärmning till kokpunkten'), text: L2('In the boiler, at constant high pressure, heat brings the liquid up to its boiling temperature.', 'I pannan, vid konstant högt tryck, värms vätskan upp till sin koktemperatur.'), dur: 2.8, deco: { heat: 'hot', work: 'out', expanding: true }, states: heatL },
        { title: L2('Boiling', 'Kokning'), text: L2(`Heat turns liquid into vapor at constant ${iT} and ${iP}. The volume grows against the piston, so work is already coming out.`, `Värmen förvandlar vätska till ånga vid konstant ${iT} och ${iP}. Volymen växer mot kolven, så arbete kommer redan ut.`), dur: 4, deco: { heat: 'hot', work: 'out', expanding: true }, states: boil, param: 'index' },
        { title: L2('Superheating', 'Överhettning'), text: L2('The vapor is heated past the boiling temperature so that it stays mostly dry during the expansion.', 'Ångan värms över koktemperaturen så att den förblir mestadels torr under expansionen.'), dur: 2.4, deco: { heat: 'hot', work: 'out', expanding: true }, states: superheat },
        { title: L2('Expansion', 'Expansion'), text: L2(`Insulated, the vapor expands and cools as it pushes the piston: most of the work comes out here. It dips into the dome, ending with about ${wet.en} of it condensed into droplets.`, `Isolerad expanderar ångan och svalnar medan den trycker kolven: det mesta arbetet kommer ut här. Den går in i kupolen och slutar med ungefär ${wet.sv} kondenserat till droppar.`), dur: 3.6, deco: { ...ins, work: 'out', expanding: true }, states: turbine },
        { title: L2('Condensing', 'Kondensering'), text: L2('Touching the cold side at low pressure, the wet vapor gives up its heat and condenses completely. The piston returns to the starting volume and the loop closes.', 'I kontakt med den kalla sidan vid lågt tryck avger den fuktiga ångan sin värme och kondenserar helt. Kolven återgår till startvolymen och slingan sluts.'), dur: 4, deco: { heat: 'cold', work: 'in', expanding: false }, states: cond, param: 'index' }
      ]
    };
  }

  function carnot() {
    const Th = 1.2, Tcold = 0.85, g = P.CV / P.R;
    const v1 = 3.2, v2 = 8.5;
    const v3 = P.b + (v2 - P.b) * Math.pow(Th / Tcold, g), v4 = P.b + (v1 - P.b) * Math.pow(Th / Tcold, g);
    const adiabat = (Ta, Tb, va) => range(Ta, Tb).map(T => { const v = P.b + (va - P.b) * Math.pow(Ta / T, g); return P.fluidState(T, P.Pvdw(T, v), v, 'gas'); });
    const segs = [isothermV(Th, v1, v2, 'gas'), adiabat(Th, Tcold, v2), isothermV(Tcold, v3, v4, 'gas'), adiabat(Tcold, Th, v4)];
    const all = segs.flatMap(s => s.slice(0, -1));
    const nums = cycleNumbers(all);
    const e = pctL(nums.eta), lim = pctL(1 - Tcold / Th);
    const effText = L2(`Integrating around the loop, the net work is <b>${e.en}</b> of the heat taken in, matching the Carnot limit 1 − ${Tcold}/${Th} = ${lim.en}. No engine working between these two temperatures can do better.`,
      `Integrerat runt slingan är nettoarbetet <b>${e.sv}</b> av den upptagna värmen, i överensstämmelse med Carnotgränsen 1 − ${sv(Tcold)}/${sv(Th)} = ${lim.sv}. Ingen motor mellan dessa två temperaturer kan göra bättre ifrån sig.`);
    return {
      id: 'carnot', name: L2('Carnot engine', 'Carnotmotor'), kind: 'engine', cycle: true, crank: true, nums, effText,
      view: { az: Math.PI / 2, el: 0, extra: [[1, 1.02, 1], [0.8, 0.2, 1], [1.24, 0.12, 1]], maxZoom: 2.2 },
      intro: {
        title: L2('The Carnot engine', 'Carnotmotorn'),
        text: L2(`Two isotherms joined by two adiabats, run entirely in the gas region. The hot reservoir is at ${Th} ${Tc} and the cold one at ${Tcold} ${Tc}. The ${PTv} view is used because the two isotherms become vertical lines at exactly those temperatures, the two numbers that set the efficiency, and it shows the whole cycle clear of the boiling curve. The work per cycle is the area of the loop in the ${PVv} view.`,
          `Två isotermer förbundna av två adiabater, helt i gasområdet. Den varma reservoaren håller ${sv(Th)} ${Tc} och den kalla ${sv(Tcold)} ${Tc}. ${PTv}-vyn används eftersom de två isotermerna blir lodräta linjer vid just de temperaturerna, de två tal som bestämmer verkningsgraden, och den visar att hela kretsprocessen ligger fri från kokpunktskurvan. Arbetet per varv är slingans area i ${PVv}-vyn.`)
      },
      segs: [
        { title: L2('Isothermal expansion', 'Isoterm expansion'), text: L2('In contact with the hot reservoir the gas expands and draws in heat, which keeps its temperature constant.', 'I kontakt med den varma reservoaren expanderar gasen och tar upp värme, som håller temperaturen konstant.'), dur: 3.6, deco: { heat: 'hot', work: 'out', expanding: true }, states: segs[0] },
        { title: L2('Adiabatic expansion', 'Adiabatisk expansion'), text: L2('Insulated, the gas keeps expanding and cools down to the cold temperature as it does work.', 'Isolerad fortsätter gasen att expandera och svalnar till den kalla temperaturen medan den uträttar arbete.'), dur: 3, deco: { heat: 'insul', work: 'out', expanding: true }, states: segs[1] },
        { title: L2('Isothermal compression', 'Isoterm kompression'), text: L2('Touching the cold reservoir, the gas is compressed and gives heat away, staying at the cold temperature.', 'I kontakt med den kalla reservoaren komprimeras gasen och avger värme, och stannar vid den kalla temperaturen.'), dur: 3.6, deco: { heat: 'cold', work: 'in', expanding: false }, states: segs[2] },
        { title: L2('Adiabatic compression', 'Adiabatisk kompression'), text: L2('Insulated again, compression heats the gas back to the hot temperature and the loop closes.', 'Isolerad igen värms gasen av kompressionen tillbaka till den varma temperaturen, och slingan sluts.'), dur: 3, deco: { heat: 'insul', work: 'in', expanding: false }, states: segs[3] }
      ]
    };
  }

  const LIST = [melting, boiling, sublimation, condensing, supercritical, rankine, carnot];
  return { build: () => LIST.map(f => f()), cycleNumbers, entropy };
})();
if (typeof module !== 'undefined') module.exports = { MAP, SCEN };

  sun.position.set(-0.4, 0.9, 1); camera.add(sun); camera.add(sun.target); sun.target.position.set(0, 0, -1);

  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const W3 = (T, p, v) => V3(X(v), Y(p), Z(T));
  const col = c => new THREE.Color(c);

  // ---------- surface patches ----------
  function patch(nu, nv, fn) {
    const pos = new Float32Array((nu + 1) * (nv + 1) * 3); let k = 0;

  }
  const { Tt, TMIN, TMAX, PMAX, TMC } = Ph;
  const vGasC = (T, p) => Math.min(Ph.vGas(T, p), Ph.VMAX);
  const PATCHES = [
    ['solid', 20, 22, (u, w) => { const T = lerp(TMIN, Tt, u), y = lerp(Y(Ph.Psub(T)), HY, w), p = Pinv(y); return [X(Ph.vSolid(T, p)), y, Z(T)]; }],
    ['solid', 20, 22, (u, w) => { const T = lerp(Tt, TMC, u), y = lerp(Y(Ph.Pmelt(T)), HY, w), p = Pinv(y); return [X(Ph.vSolid(T, p)), y, Z(T)]; }],
    ['SV', 24, 24, (u, w) => { const T = lerp(TMIN, Tt, u), p = Ph.Psub(T); return [lerp(X(Ph.vSolid(T, p)), X(vGasC(T, p)), w), Y(p), Z(T)]; }],
    ['SL', 24, 16, (u, w) => { const T = lerp(Tt, TMC, u), p = Ph.Pmelt(T); return [lerp(X(Ph.vSolid(T, p)), X(Ph.vLiq(T, p)), w), Y(p), Z(T)]; }],
    ['LV', 64, 30, (u, w) => { const T = TD(u), s = Ph.sat(T); return [lerp(X(s.vl), X(s.vg), w), Y(s.P), Z(T)]; }],
    ['liquid', 30, 30, (u, w) => { const T = lerp(Tt, TMC, u), y = lerp(Y(Ph.sat(T).P), Y(Ph.Pmelt(T)), w), p = Pinv(y); return [X(Ph.vLiq(T, p)), y, Z(T)]; }],
    ['liquid', 30, 30, (u, w) => { const T = 1 - (1 - TMC) * (1 - u) * (1 - u), y = lerp(Y(Ph.sat(T).P), HY, w), p = Pinv(y); return [X(Ph.vLiq(T, p)), y, Z(T)]; }],
    ['sc', 30, 30, (u, w) => { const T = lerp(1, TMAX, u), y = lerp(Y(1), HY, w), p = Pinv(y); return [X(Ph.vLiq(T, p)), y, Z(T)]; }],
    ['gas', 24, 40, (u, w) => { const T = lerp(TMIN, Tt, u), x = lerp(X(vGasC(T, Ph.Psub(T))), WX, w), v = Vinv(x); return [x, Y(Ph.Pvdw(T, v)), Z(T)]; }],
    ['gas', 60, 40, (u, w) => { const T = TD(u), x = lerp(X(Ph.sat(T).vg), WX, w), v = Vinv(x); return [x, Y(Ph.Pvdw(T, v)), Z(T)]; }],
    ['gas', 30, 40, (u, w) => { const T = lerp(1, TMAX, u), x = lerp(X(Ph.vLiq(T, 1)), WX, w), v = Vinv(x); return [x, Y(Ph.Pvdw(T, v)), Z(T)]; }]
  ];
  const surf = new THREE.Group(); scene.add(surf);
  const surfMeshes = [];
  const surfMats = {};
  for (const [region, nu, nv, fn] of PATCHES) {
    if (!surfMats[region]) surfMats[region] = new THREE.MeshLambertMaterial({ color: col(C[region]), side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 3 });
    const m = new THREE.Mesh(patch(nu, nv, fn), surfMats[region]);
    m.userData.region = region; surf.add(m); surfMeshes.push(m);
  }

  // ---------- lines & tubes ----------
  class PolyCurve extends THREE.Curve {
    constructor(pts) {
      super();
      this.pts = pts.filter((p, i) => i === 0 || p.distanceTo(pts[i - 1]) > 1e-6);
      if (this.pts.length < 2) this.pts.push(this.pts[0].clone().add(V3(1e-4, 0, 0)));
      this.cum = [0];
      for (let i = 1; i < this.pts.length; i++) this.cum.push(this.cum[i - 1] + this.pts[i].distanceTo(this.pts[i - 1]));
      this.len = this.cum[this.cum.length - 1];
    }
    getPoint(t, target = new THREE.Vector3()) {
      const d = clamp(t, 0, 1) * this.len, c = this.cum;
      let lo = 0, hi = c.length - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] > d) hi = m; else lo = m; }
      const f = (d - c[lo]) / Math.max(1e-9, c[hi] - c[lo]);
      return target.copy(this.pts[lo]).lerp(this.pts[hi], f);
    }
  }
  const tube = (pts, r, mat, segs) => { const cv = new PolyCurve(pts); return new THREE.Mesh(new THREE.TubeGeometry(cv, segs || Math.min(900, Math.max(8, cv.pts.length * 2)), r, 7, false), mat); };
  const line = (pts, mat) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat); if (mat.isLineDashedMaterial) l.computeLineDistances(); return l; };

  const inkTubeMat = new THREE.MeshBasicMaterial({ color: col(C.ink) });
  const isoMat = new THREE.LineBasicMaterial({ color: col(C.iso), transparent: true, opacity: 0.55 });
  const critMat = new THREE.LineDashedMaterial({ color: col(C.ink), dashSize: 0.14, gapSize: 0.09, transparent: true, opacity: 0.9 });

  // boundary curves (as T,P,v triples)
  const satL = range(0, 1, 90).map(u => { const T = TD(u), s = Ph.sat(T); return W3(T, s.P, s.vl); });
  const satG = range(0, 1, 90).map(u => { const T = TD(u), s = Ph.sat(T); return W3(T, s.P, s.vg); });
  const meltS = range(Tt, TMC, 30).map(T => W3(T, Ph.Pmelt(T), Ph.vSolid(T, Ph.Pmelt(T))));
  const meltL = range(Tt, TMC, 30).map(T => W3(T, Ph.Pmelt(T), Ph.vLiq(T, Ph.Pmelt(T))));
  const subS = range(TMIN, Tt, 30).map(T => W3(T, Ph.Psub(T), Ph.vSolid(T, Ph.Psub(T))));
  const Tsv = (() => { let lo = TMIN, hi = Tt; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (Ph.vGas(m, Ph.Psub(m)) > Ph.VMAX) lo = m; else hi = m; } return hi; })();
  const subG = range(Tsv, Tt, 30).map(T => W3(T, Ph.Psub(T), Ph.vGas(T, Ph.Psub(T))));
  const TR = Ph.TRIPLE, vsT = Ph.vSolid(Tt, Ph.Pt);
  const triplePts = [W3(Tt, Ph.Pt, vsT), W3(Tt, Ph.Pt, TR.vg)];
  const bounds = new THREE.Group(); scene.add(bounds);
  const cpPos = W3(1, 1, 1);
  const cpSphere = new THREE.Mesh(new THREE.SphereGeometry(0.1, 18, 12), inkTubeMat); cpSphere.position.copy(cpPos); scene.add(cpSphere);
  let boundsZoom = 0;
  function buildBounds(zoom) {
    if (boundsZoom && Math.abs(Math.log(zoom / boundsZoom)) < 0.22) return;
    boundsZoom = zoom;
    bounds.children.slice().forEach(o => { bounds.remove(o); o.geometry.dispose(); });
    const k = 1 / Math.pow(zoom, 0.85);
    [satL, [...satG].reverse(), meltS, meltL, subS, subG].forEach(p => bounds.add(tube(p, 0.024 * k, inkTubeMat)));
    bounds.add(tube(triplePts, 0.045 * k, inkTubeMat, 20));
    cpSphere.scale.setScalar(k);
  }
  buildBounds(1);
  const cpPick = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), new THREE.MeshBasicMaterial({ visible: false })); cpPick.position.copy(cpPos); cpPick.userData.region = 'critical'; scene.add(cpPick);
  const tripPick = new THREE.Mesh(new THREE.TubeGeometry(new PolyCurve(triplePts), 10, 0.16, 6), new THREE.MeshBasicMaterial({ visible: false })); tripPick.userData.region = 'triple'; scene.add(tripPick);

  // outline of the cut edges of the surface (keeps the silhouette crisp)
  const edgeMat = new THREE.LineBasicMaterial({ color: col(C.ink), transparent: true, opacity: 0.45 });
  const edges = new THREE.Group(); scene.add(edges);
  function buildEdges() {
    const topPts = range(TMIN, TMAX, 80).map(T => T <= TMC ? V3(X(Ph.vSolid(T, PMAX)), HY, Z(T)) : V3(X(Ph.vLiq(T, PMAX)), HY, Z(T)));
    edges.add(line(topPts, edgeMat));
    edges.add(line(range(0, 1, 50).map(w => { const T = TMAX, x = lerp(X(Ph.vLiq(T, PMAX)), WX, w); return V3(x, Y(Ph.Pvdw(T, Vinv(x))), Z(T)); }), edgeMat));
    edges.add(line(isotherm(TMIN), edgeMat));
    edges.add(line(range(TMIN, TMAX, 80).map(T => V3(WX, Y(Ph.Pvdw(T, Ph.VMAX)), Z(T))), edgeMat));
  }

  // isotherm across all regions
  function isotherm(T) {
    const pts = [];
    const down = (pa, pb, vf, n = 24) => { for (const y of range(Y(pa), Y(pb), n)) { const p = Pinv(y); pts.push(W3(T, p, vf(p))); } };
    const across = (p, va, vb, n = 24, pv = null) => { for (const x of range(X(va), X(vb), n)) { const v = Vinv(x); pts.push(W3(T, pv ? pv(v) : p, v)); } };

  // ---------- walls with projections ----------

  const walls = new THREE.Group(); scene.add(walls);
  const wallPT = new THREE.Group(), wallPV = new THREE.Group(); walls.add(wallPT, wallPV);
  const wallMat = new THREE.MeshBasicMaterial({ color: col(C.wall), transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
  const wallLine = new THREE.LineBasicMaterial({ color: col(C.ink), transparent: true, opacity: 0.8 });
  const wallFrame = new THREE.LineBasicMaterial({ color: col(C.muted), transparent: true, opacity: 0.5 });
  const fillMats = {};
  const fillMat = key => fillMats[key] || (fillMats[key] = new THREE.MeshBasicMaterial({ color: col(C[key]), transparent: true, opacity: 0.42, side: THREE.DoubleSide, depthWrite: false }));
  // polygon on the P–T wall: pts [T,P] -> (XW, Y(P), Z(T))
  function ptPoly(pts, key) {
    const shape = new THREE.Shape(pts.map(([T, p]) => new THREE.Vector2(Z(T), Y(p))));
    const g = new THREE.ShapeGeometry(shape);

  }

  }
  function buildWalls() {

    const pvBg = new THREE.Mesh(new THREE.PlaneGeometry(WX, HY), wallMat); pvBg.position.set(WX / 2, HY / 2, ZW); wallPV.add(pvBg);

    wallPV.add(line([V3(0, 0, ZW), V3(0, HY, ZW), V3(WX, HY, ZW), V3(WX, 0, ZW), V3(0, 0, ZW)], wallFrame));
    // P–T regions
    const sub = range(TMIN, Tt, 30).map(T => [T, Ph.Psub(T)]);

    // P–V regions

    const dome = [...range(0, 1, 70).map(u => { const T = TD(u), s = Ph.sat(T); return pv(s.vl, s.P); }), ...range(1, 0, 70).map(u => { const T = TD(u), s = Ph.sat(T); return pv(s.vg, s.P); })];

    const solidL = range(TMIN, TMC, 30).map(T => pv(Ph.vSolid(T, PMAX), PMAX));
    wallPV.add(pvPoly([pv(Ph.vSolid(TMIN, Ph.Psub(TMIN)), Ph.Psub(TMIN)), ...[...svL].reverse(), ...slL, ...[...solidL].reverse()], 'solid'));
    const pvc = a => a.map(([x, y]) => V3(x, y, ZW + 0.02));
    wallPV.add(line(pvc(dome), wallLine));
    wallPV.add(line(pvc([pv(vsT, Ph.Pt), pv(TR.vg, Ph.Pt)]), wallLine));
    wallPV.add(line(pvc(slL), wallLine)); wallPV.add(line(pvc([...slR].reverse()), wallLine));
    wallPV.add(line(pvc(svR.filter(p => p[0] < WX - 1e-3)), wallLine));
    const crit = isotherm(1).map(p => V3(p.x, p.y, ZW + 0.02));
    wallPV.add(line(crit, critMat));
    // points
    const dotG = new THREE.CircleGeometry(0.075, 16);
    const mkDot = (pos, rotY, g) => { const m = new THREE.Mesh(dotG, inkTubeMat); m.position.copy(pos); if (rotY) m.rotation.y = Math.PI / 2; g.add(m); };
    mkDot(V3(XW + 0.03, Y(Ph.Pt), Z(Tt)), true, wallPT); mkDot(V3(XW + 0.03, Y(1), Z(1)), true, wallPT); mkDot(V3(X(1), Y(1), ZW + 0.03), false, wallPV);

  buildWalls();

  // ---------- axes ----------
  const axisMat = new THREE.LineBasicMaterial({ color: col(C.ink) });
  const axes = new THREE.Group(); scene.add(axes);
  const ZF = 0.55, XR = WX + 0.55;
  axes.add(line([V3(-0.55, 0, ZF), V3(XR, 0, ZF)], axisMat));
  axes.add(line([V3(XR, 0, ZF), V3(XR, 0, -DZ - 0.3)], axisMat));
  axes.add(line([V3(-0.55, 0, ZF), V3(-0.55, HY + 0.35, ZF)], axisMat));
  const tk = 0.16;
  const ticksV = [1, 10].map(v => X(v)), ticksT = [Tt, 1].map(Z), ticksP = [Ph.Pt, 1].map(Y);
  ticksV.forEach(x => axes.add(line([V3(x, 0, ZF), V3(x, -tk, ZF)], axisMat)));
  ticksT.forEach(z => axes.add(line([V3(XR, 0, z), V3(XR, -tk, z)], axisMat)));
  ticksP.forEach(y => { axes.add(line([V3(-0.55, y, ZF), V3(-0.55 - tk, y, ZF)], axisMat)); axes.add(line([V3(-0.55, y, ZF), V3(-0.55, y, ZF + tk)], axisMat)); });

  // ---------- HTML labels ----------
  const layer = $('#labels');
  const labels = [];
  function mkLabel(cls, html, pos, opt = {}) {
    const el = document.createElement('div'); el.className = 'lab ' + cls; el.innerHTML = html; layer.appendChild(el);
    const L = Object.assign({ el, pos, html, visible: true, group: cls.split(' ')[0] }, opt); labels.push(L); return L;
  }
  const i = s => `<i>${s}</i>`;
  const sub = (a, b) => `<i>${a}</i><sub>${b}</sub>`;
  // axis labels: 'axis' says along which world direction the axis runs, so it hides when seen end-on
  mkLabel('axis name', '', V3(XR - 0.1, -0.55, ZF), { axis: V3(1, 0, 0), text: () => `${i('V')}<small>${I18N.t('logScale')}</small>` });
  mkLabel('axis name', i('T'), V3(XR, -0.55, -DZ - 0.3), { axis: V3(0, 0, 1) });
  mkLabel('axis name', `${i('P')}`, V3(-0.55, HY + 0.7, ZF), { axis: V3(0, 1, 0) });
  mkLabel('axis tick', sub('V', 'c'), V3(X(1), -0.42, ZF), { axis: V3(1, 0, 0) });
  mkLabel('axis tick', `10${sub('V', 'c')}`, V3(X(10), -0.42, ZF), { axis: V3(1, 0, 0) });
  mkLabel('axis tick', sub('T', 't'), V3(XR, -0.42, Z(Tt)), { axis: V3(0, 0, 1) });
  mkLabel('axis tick', sub('T', 'c'), V3(XR, -0.42, Z(1)), { axis: V3(0, 0, 1) });
  mkLabel('axis tick left', sub('P', 't'), V3(-0.85, Y(Ph.Pt), ZF + 0.3), { axis: V3(0, 1, 0) });
  mkLabel('axis tick left', sub('P', 'c'), V3(-0.85, Y(1), ZF + 0.3), { axis: V3(0, 1, 0) });

  const midX = (T, p, va, vb, f = 0.5) => V3(lerp(X(va), X(vb), f), Y(p), Z(T));
  const regionLabels = [
    ['solid', W3(0.53, 1.25, Ph.vSolid(0.53, 1.25))],
    ['liquid', W3(0.8, 1.45, Ph.vLiq(0.8, 1.45))],
    ['gas', (() => { const T = 1.08, v = 21; return W3(T, Ph.Pvdw(T, v), v); })()],
    ['sc', W3(1.16, 1.55, Ph.vLiq(1.16, 1.55))],
    ['SL', (() => { const T = 0.7, p = Ph.Pmelt(T); return midX(T, p, Ph.vSolid(T, p), Ph.vLiq(T, p)); })()],
    ['LV', (() => { const T = 0.78, s = Ph.sat(T); return midX(T, s.P, s.vl, s.vg, 0.55); })()],
    ['SV', (() => { const T = 0.52, p = Ph.Psub(T); return midX(T, p, Ph.vSolid(T, p), vGasC(T, p), 0.62); })()],
    ['triple', V3(X(7), Y(Ph.Pt), Z(Tt))],
    ['critical', cpPos.clone()]
  ];
  // names follow the language; coexistence regions are named after their curve in the P–T view
  regionLabels.forEach(([key, pos]) => mkLabel('region r-' + key, '', pos, { key, text: vk => { const r = I18N.reg(key); return vk === 'pt' && r.curve ? r.curve : r.name; } }));

  // ---------- camera ----------
  const cam = { az: 0.72, el: 0.42, zoom: 1, target: V3(WX / 2, HY / 2, -DZ / 2) };
  const VIEW_H = 11;

  function basis(az, el) {

    const vb = document.getElementById('vbtns');
    INSET.top = (vb ? vb.offsetHeight : 40) + 22;

    setText(rT, fmt(st.T, 3)); setText(rP, fmtP(st.P)); setText(rV, fmtV(st.v));
    setText(rR, regionName(st));
    const sc = st.region === 'sc' || (st.T >= 1 && st.fg > 0.99 && st.P >= 1);
    const w = { s: st.fs, l: st.fl, g: st.fg };
    for (const k in bars) { const pct = (100 * w[k]).toFixed(1) + '%'; if (bars[k].__w !== pct) { bars[k].style.width = pct; bars[k].__w = pct; } }
    bars.g.classList.toggle('sc', sc);
    const parts = [], t = I18N.t, pc = t('pct');
    if (st.fs > 0.005) parts.push(`${t('solid')} ${pc(st.fs)}`);
    if (st.fl > 0.005) parts.push(`${t('liquid')} ${pc(st.fl)}`);
    if (st.fg > 0.005) parts.push(`${t(sc ? 'scfluid' : (st.T >= 1 ? 'gas' : 'vapor'))} ${pc(st.fg)}`);
    let txt = parts.join(', ');
    txt = txt.charAt(0).toUpperCase() + txt.slice(1);
    setText(legend, txt);
  }
  let lastCardKey = null;
  function updateCard(seg) {
    const sc = TL.sc;
    let key, stepLab, title, text;
    const Lg = I18N.L, t = I18N.t;
    if (sc.explore) { key = 'explore:' + I18N.lang; stepLab = ''; title = Lg(sc.intro.title); text = Lg(sc.intro.text); }
    else {
      const n = sc.segs.length;
      let k = TL.mode === 'steps' ? TL.step : (TL.t <= 1e-6 && !TL.playing ? 0 : seg + 1);
      if (TL.mode === 'continuous' && TL.playing) k = seg + 1;
      key = sc.id + ':' + k + ':' + TL.mode + ':' + I18N.lang;
      if (k === 0) { stepLab = t('intro')(Lg(sc.name)); title = Lg(sc.intro.title); text = Lg(sc.intro.text); }
      else {
        const g = sc.segs[k - 1];
        const m = sc.markers;
        const from = m[k - 1].label, to = sc.cycle ? m[k % n].label : m[k].label;
        stepLab = t('stepOf')(k, n, from, to); title = Lg(g.title); text = Lg(g.text);
      }
    }
    if (key === lastCardKey) return;
    lastCardKey = key;
    $('#cStep').textContent = stepLab;
    $('#cTitle').innerHTML = title;
    $('#cText').innerHTML = text;
    const ex = $('#cExtra');
    if (sc.effText) { ex.innerHTML = Lg(sc.effText); ex.hidden = false; } else ex.hidden = true;
    const card = $('#card'); card.classList.remove('fresh'); void card.offsetWidth; card.classList.add('fresh');
  }
  let aboutPinned = null, lastAbout = null;
  function updateAbout(stRegion) {
    const key = aboutPinned || stRegion;
    const k2 = key + (aboutPinned ? ':p' : '') + ':' + I18N.lang;
    if (k2 === lastAbout) return; lastAbout = k2;
    if (!REG[key]) return;
    const r = I18N.reg(key);
    $('#aTitle').textContent = r.name;
    $('#aSwatch').style.background = `var(--c-${r.color === 'ink' ? 'ink' : r.color.toLowerCase()})`;
    $('#aText').innerHTML = r.text;
    $('#aLead').textContent = I18N.t(aboutPinned ? 'leadPinned' : 'lead');
    $('#aUnpin').hidden = !aboutPinned;
  }
  $('#aUnpin').addEventListener('click', () => { aboutPinned = null; });

  // ---------- picking ----------
  const ray = new THREE.Raycaster();
  const pickables = [...surfMeshes, A.cpPick, A.tripPick];
  function pick(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const ndc = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(pickables, false);
    if (!hits.length) return null;
    // prefer the special pick volumes when they are hit close to the front
    const first = hits[0];
    const special = hits.find(h => (h.object === A.cpPick || h.object === A.tripPick) && h.distance < first.distance + 0.35);
    const h = special || first;
    return { region: h.object.userData.region, p: h.point };
  }
  function stateFromHit(region, p) {
    let T = clamp(Tinv(p.z), Ph.TMIN, Ph.TMAX), v = Vinv(clamp(p.x, 0, WX)), P = Pinv(clamp(p.y, 0, HY));
    const { Tt, TMC, PMAX } = Ph;
    switch (region) {
      case 'solid': { const pb = T < Tt ? Ph.Psub(T) : Ph.Pmelt(T); T = Math.min(T, TMC); return Ph.single(T, clamp(P, pb, PMAX), 'solid'); }
      case 'liquid': { T = clamp(T, Tt + 1e-4, 0.999); const ps = Ph.sat(T).P; return Ph.single(T, clamp(P, ps, Math.min(Ph.Pmelt(T), PMAX)), 'liquid'); }
      case 'sc': { T = Math.max(T, 1); const pp = clamp(P, 1, PMAX), vv = Ph.vLiq(T, pp); return Ph.fluidState(T, pp, vv, 'liquid'); }
      case 'gas': { if (T < 1) { const vg = T < Tt ? Ph.vGas(T, Ph.Psub(T)) : Ph.sat(T).vg; v = Math.max(v, Math.min(vg, Ph.VMAX)); } return Ph.fluidState(T, Ph.Pvdw(T, v), v, 'gas'); }
      case 'LV': { T = clamp(T, Tt, 0.999); const s = Ph.sat(T); v = clamp(v, s.vl, s.vg); return Ph.coex(T, s.P, s.vl, s.vg, 'liquid', 'gas', (v - s.vl) / (s.vg - s.vl)); }
      case 'SL': { T = clamp(T, Tt, TMC); const pm = Ph.Pmelt(T), vs = Ph.vSolid(T, pm), vl = Ph.vLiq(T, pm); v = clamp(v, vs, vl); return Ph.coex(T, pm, vs, vl, 'solid', 'liquid', (v - vs) / (vl - vs)); }
      case 'SV': { T = clamp(T, Ph.TMIN, Tt); const ps = Ph.Psub(T), vs = Ph.vSolid(T, ps), vg = Ph.vGas(T, ps); v = clamp(v, vs, Math.min(vg, Ph.VMAX)); return Ph.coex(T, ps, vs, vg, 'solid', 'gas', (v - vs) / (vg - vs)); }
      case 'triple': {
        const vs = Ph.vSolid(Tt, Ph.Pt), vl = Ph.TRIPLE.vl, vg = Ph.TRIPLE.vg, fl = 0.3;
        let fg = clamp((v - fl * vl - (1 - fl) * vs) / (vg - vs), 0, 1 - fl); const fs = 1 - fl - fg;
        return { T: Tt, P: Ph.Pt, v: fs * vs + fl * vl + fg * vg, fs, fl, fg, coh: null, region: 'triple' };
      }
      case 'critical': { const st = Ph.fluidState(1, 1, 1, 'liquid'); st.region = 'critical'; return st; }
    }
    return null;
  }

  // ---------- pointer: orbit / pan / zoom / click ----------
  const pointers = new Map();
  let drag = null, pinch = null, hoverXY = null;
  const tip = $('#tip');
  function userMoved() { A.cancelTween(); activeView = null; $$('#vbtns [data-view]').forEach(b => b.setAttribute('aria-pressed', 'false')); camChanged(); }
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, moved: 0, pan: e.button === 2 || e.shiftKey, button: e.button };
    else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: cam.zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; if (drag) drag.moved = 99; }
    tip.hidden = true;
  });
  canvas.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      cam.zoom = clamp(pinch.zoom * d / Math.max(10, pinch.d), 0.4, 8);
      panBy(mx - pinch.mx, my - pinch.my); pinch.mx = mx; pinch.my = my;
      userMoved(); return;
    }
    if (drag && pointers.size === 1) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      if (drag.moved < 4) return;
      if (drag.pan) panBy(dx, dy);
      else { cam.az -= dx * 0.008; cam.el = clamp(cam.el + dy * 0.008, -0.1, 1.5); }
      userMoved(); return;
    }
    if (e.pointerType === 'mouse') hoverXY = { x: e.clientX, y: e.clientY };
  });
  function panBy(dx, dy) {
    const { right, up } = basis(cam.az, cam.el);
    const k = (A.VIEW_H / cam.zoom) / Math.max(50, vp.clientHeight);
    cam.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
  }
  function endPointer(e) {
    const wasClick = drag && drag.moved < 5 && pointers.size === 1 && drag.button === 0;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) { if (wasClick) onClick(e.clientX, e.clientY); drag = null; }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); pinch = null; drag = null; });
  canvas.addEventListener('pointerleave', () => { hoverXY = null; tip.hidden = true; setHover(null); });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left - r.width / 2, my = e.clientY - r.top - r.height / 2;
    const z0 = cam.zoom, z1 = clamp(z0 * Math.exp(-e.deltaY * 0.0016), 0.4, 8);
    // zoom toward the cursor
    const k0 = (A.VIEW_H / z0) / r.height, k1 = (A.VIEW_H / z1) / r.height;
    const { right, up } = basis(cam.az, cam.el);
    cam.target.addScaledVector(right, mx * (k0 - k1)).addScaledVector(up, -my * (k0 - k1));
    cam.zoom = z1; userMoved();
  }, { passive: false });
  canvas.addEventListener('dblclick', () => setView('rec'));

  let hovered = null;
  function setHover(region) {
    if (hovered === region) return;
    hovered = region;
    surfMeshes.forEach(m => { m.material.emissive.setHex(0); });
    if (region && A.surfMats[region]) A.surfMats[region].emissive.set(document.documentElement.dataset.scheme === 'dark' ? 0x2a2a2a : 0x262626);
  }
  function onClick(cx, cy) {
    const h = pick(cx, cy);
    if (!h) return;
    if (TL.sc && TL.sc.explore) {
      const st = stateFromHit(h.region, h.p);
      if (st) { exploreState = st; exploreRegion = h.region; aboutPinned = null; }
    } else {
      aboutPinned = h.region;
    }
  }
  function doHover() {
    if (!hoverXY || drag) { return; }
    const h = pick(hoverXY.x, hoverXY.y);
    if (!h) { tip.hidden = true; setHover(null); canvas.style.cursor = 'grab'; return; }
    setHover(h.region);
    const r = I18N.reg(h.region);
    const hint = I18N.t(TL.sc && TL.sc.explore ? 'tipExplore' : 'tipRead');
    setText(tip, `<b><span class="sw" style="background:var(--c-${r.color === 'ink' ? 'ink' : r.color.toLowerCase()})"></span>${r.name}</b><span>${hint}</span>`);
    const vr = vp.getBoundingClientRect();
    let x = hoverXY.x - vr.left + 14, y = hoverXY.y - vr.top + 16;
    x = Math.min(x, vr.width - 190); y = Math.min(y, vr.height - 60);
    tip.style.transform = `translate(${x}px, ${y}px)`; tip.hidden = false;
    canvas.style.cursor = 'pointer';
  }

  // ---------- labels per frame ----------
  const tmpV = new THREE.Vector3();
  function updateLabels(now) {
    const { w, h } = { w: vp.clientWidth, h: vp.clientHeight };
    const vk = viewKind(), d = A.dirOf(cam.az, cam.el);
    const occ = vk === 'd3' && A.getCamDirty() && now - A.getOcclusionAt() > 120;
    if (occ) A.setOcclusionAt(now);
    for (const L of labels) {
      let show = true;
      if (L.group === 'region') show = toggles.labels;
      if (L.axis) show = Math.abs(L.axis.dot(d)) < 0.9;
      if (L.text) { const t = L.text(vk); if (L.el.__t !== t) { L.el.innerHTML = t; L.el.__t = t; } }
      if (!show) { if (L.el.style.display !== 'none') L.el.style.display = 'none'; continue; }
      if (L.el.style.display === 'none') L.el.style.display = '';
      tmpV.copy(L.pos).project(camera);
      const x = (tmpV.x + 1) / 2 * w, y = (1 - tmpV.y) / 2 * h;
      let out = x < -40 || x > w + 40 || y < -20 || y > h + 20;
      if (L.group === 'region') {
        if (L.el.__ow == null || L.el.__owt !== L.el.textContent) { L.el.__ow = L.el.offsetWidth; L.el.__owt = L.el.textContent; }
        out = x - L.el.__ow / 2 < 4 || x + L.el.__ow / 2 > w - 4 || y < 52 || y > h - 30;
      }
      L.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      L.el.classList.toggle('off', out);
      if (vk !== 'd3') L.el.classList.remove('hidden');
      else if (occ && (L.group === 'region' || L.group === 'marker')) {
        ray.set(L.pos.clone().addScaledVector(d, 60), d.clone().negate());
        const hit = ray.intersectObjects(surfMeshes, false)[0];
        L.el.classList.toggle('hidden', !!hit && hit.distance < 60 - 0.15);
      }
    }
    // markers that land on the same screen spot (a coexistence stage seen end-on) share one label
    const seen = [];
    for (const m of markerObjs) {
      const L = m.label; tmpV.copy(L.pos).project(camera);
      const x = tmpV.x * w / 2, y = tmpV.y * h / 2;
      const hit = seen.find(o => Math.hypot(o.x - x, o.y - y) < 14);
      if (hit) { hit.parts.push(L.html); L.el.style.display = 'none'; }
      else seen.push({ x, y, L, parts: [L.html] });
    }
    seen.forEach(o => { const t = o.parts.join(', '); if (o.L.el.__t !== t) { o.L.el.textContent = t; o.L.el.__t = t; } });
    if (occ) A.clearCamDirty();
  }

  // ---------- theme ----------
  function applyTheme() {
    A.readTheme();
    for (const k in A.surfMats) A.surfMats[k].color.set(C[k]);
    A.inkTubeMat.color.set(C.ink); A.isoMat.color.set(C.iso); A.critMat.color.set(C.ink);
    A.wallMat.color.set(C.wall); A.wallLine.color.set(C.ink); A.wallFrame.color.set(C.muted); A.edgeMat.color.set(C.ink); A.axisMat.color.set(C.ink);
    for (const k in A.fillMats) A.fillMats[k].color.set(C[k]);
    [redMat, redFaint, redGhost, dotMat, shMat].forEach(m => m.color.set(C.red)); shadowMat.color.set(C.red);
    haloMat.color.set(C.paper); markMat.color.set(C.ink);
    document.documentElement.dataset.scheme = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light' || document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  applyTheme();

  // ---------- sizing ----------
  function resize() {
    const w = vp.clientWidth, h = vp.clientHeight;
    renderer.setSize(w, h, false);
    camChanged();
  }
  new ResizeObserver(() => { resize(); if (activeView) setView(activeView, true); }).observe(vp);
  new ResizeObserver(() => bview.resize()).observe(boxCanvas);
  resize();

  // ---------- language ----------
  function applyLang() {
    const t = I18N.t;
    document.documentElement.lang = I18N.lang;
    document.title = t('docTitle');
    $$('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
    $$('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    $$('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
    $$('.chip[data-s]').forEach(c => {
      const sc = c.dataset.s === 'explore' ? null : SCS.find(x => x.id === c.dataset.s);
      c.textContent = sc ? I18N.L(sc.name) : t('explore');
    });
    $$('#speeds [data-speed]').forEach(b => { b.textContent = I18N.num(+b.dataset.speed, b.dataset.speed.includes('.') ? 1 : 0) + '×'; });
    const lb = $('#langBtn'); lb.textContent = t('langBtn'); lb.setAttribute('aria-label', t('langAria')); lb.lang = I18N.lang === 'en' ? 'sv' : 'en';
    lastCardKey = null; lastAbout = null;
    labels.forEach(L => { L.el.__t = null; L.el.__ow = null; });
    if (TL.sc) $('#boxcap').innerHTML = t(TL.sc.kind === 'engine' ? 'capEngine' : 'capPhase');
    tip.hidden = true; if (tip.__v) tip.__v = null;
    updateTransport();
  }
  $('#langBtn').addEventListener('click', () => I18N.set(I18N.lang === 'en' ? 'sv' : 'en'));
  I18N.on(applyLang);
  const noteBtn = $('#noteBtn'), note = $('#note');
  noteBtn.addEventListener('click', () => { const open = note.hidden; note.hidden = !open; noteBtn.setAttribute('aria-expanded', String(open)); });
  $('#noteClose').addEventListener('click', () => { note.hidden = true; noteBtn.setAttribute('aria-expanded', 'false'); noteBtn.focus(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !note.hidden) { note.hidden = true; noteBtn.setAttribute('aria-expanded', 'false'); } });

  // ---------- loop ----------
  let last = performance.now(), hoverAt = 0, zoomCheckAt = 0;
  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, 0.05); last = Math.max(last, now);
    stepTween(now);
    if (!A.tween && now - zoomCheckAt > 250) {
      zoomCheckAt = now;
      A.buildBounds(cam.zoom);
      if (TL.sc && !TL.sc.explore && Math.abs(Math.log(cam.zoom / pathZoom)) > 0.22) buildTubes(TL.sc, cam.zoom);
    }
    tick(dt);
    cur = stateNow();
    const st = cur.st;
    dot.position.copy(cur.w); halo.position.copy(cur.w);
    const s = 1 / Math.pow(cam.zoom, 0.9); dot.scale.setScalar(s); halo.scale.setScalar(s);
    markerObjs.forEach(m => m.mesh.scale.setScalar(s));
    shPT.position.set(XW + 0.04, cur.w.y, cur.w.z); shPV.position.set(cur.w.x, cur.w.y, ZW + 0.04);
    shPT.scale.setScalar(s); shPV.scale.setScalar(s);
    if (TL.sc && !TL.sc.explore) {
      setTraversed(cur.gl / Math.max(1e-9, TL.sc.len));
      if (!scrubbing) scrub.value = String(Math.round(1000 * TL.t / TL.sc.total));
      const g = TL.sc.segs[Math.max(0, cur.seg)];
      const deco = Object.assign({}, g.deco);
      if (TL.mode === 'steps' && TL.step === 0) deco.heat = deco.heat === 'insul' ? 'insul' : null;
      if (TL.sc.kind === 'phase' && TL.mode === 'continuous' && TL.hold > 0) { /* hold at end */ }
      sim.setState(st); sim.step(dt); C.txt = I18N.D[I18N.lang]; bview.draw(deco, C);
      updateCard(cur.seg);
    } else {
      sim.setState(st); sim.step(dt); C.txt = I18N.D[I18N.lang]; bview.draw({ heat: null, piston: 'free' }, C);
      updateCard(-1);
    }
    updateReadout(st);
    updateAbout(st.region);
    if (now - hoverAt > 60) { hoverAt = now; doHover(); }
    const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
    const proj = (1 - sm(cam.el / 0.18)) * (1 - sm(Math.min(Math.abs(Math.sin(cam.az)), Math.abs(Math.cos(cam.az))) / 0.18));
    const dv = A.dirOf(cam.az, cam.el);
    A.wallPT.visible = Math.abs(dv.x) > 0.12; A.wallPV.visible = Math.abs(dv.z) > 0.12;
    const dk = document.documentElement.dataset.scheme === 'dark' ? 0.86 : 1;
    A.amb.intensity = dk * lerp(0.6, 0.84, proj); A.sun.intensity = dk * lerp(0.52, 0.26, proj);
    applyCam();
    renderer.render(scene, camera);
    updateLabels(now);
    requestAnimationFrame(frame);
  }
  $$('#modes [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === TL.mode)));
  $('#card').setAttribute('aria-live', TL.mode === 'steps' ? 'polite' : 'off');
  applyLang();
  loadScenario('explore', { instant: true });
  requestAnimationFrame(frame);
  window.__PVT = { loadScenario, setView, next, prev, playPause, setMode, TL, cam, SCS, sim, bview, get cur() { return cur; } };
})();
